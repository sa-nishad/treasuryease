<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAMT and TWIST Parser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: fixed settings rail on the left, results workspace (summary tiles, tabs, table) on the right. */
:root{
  --bg:#f3f5f7; --panel:#ffffff; --ink:#14202b; --muted:#5a6b7b; --line:#d9e0e6;
  --accent:#0b6e6e; --accent-ink:#ffffff; --soft:#e3f1f0; --head:#eef2f5;
  --ok:#1b7a43; --warn:#9a5b00; --bad:#b3261e;
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e151b; --panel:#151e26; --ink:#e5ecf2; --muted:#93a3b2; --line:#25323d;
    --accent:#4cc2b8; --accent-ink:#04201d; --soft:#12302f; --head:#1b2630;
    --ok:#5fd08c; --warn:#e6a448; --bad:#ff8a80; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e151b; --panel:#151e26; --ink:#e5ecf2; --muted:#93a3b2; --line:#25323d;
  --accent:#4cc2b8; --accent-ink:#04201d; --soft:#12302f; --head:#1b2630;
  --ok:#5fd08c; --warn:#e6a448; --bad:#ff8a80; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
h1,h2{margin:0}
.app{height:100%;display:grid;grid-template-columns:320px minmax(0,1fr)}
.side{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:20px 18px;display:flex;flex-direction:column;gap:20px}
.main{min-width:0;min-height:0;display:flex;flex-direction:column;gap:14px;padding:18px 20px}
.brand{display:flex;gap:12px;align-items:center}
.mark{width:38px;height:38px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.brand h1{font-size:17px;font-weight:600;letter-spacing:-.01em}
.brand p{margin:0;color:var(--muted);font-size:12.5px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.drop{display:block;border:1.5px dashed var(--line);border-radius:10px;padding:18px 14px;text-align:center;cursor:pointer;background:var(--bg);transition:border-color .15s,background .15s}
.drop strong{display:block;font-weight:600}
.drop small{display:block;color:var(--muted);margin-top:4px;font-size:12px}
.drop:hover,.drop.over,#file:focus-visible+.drop{border-color:var(--accent);background:var(--soft)}
.sec h2{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:8px}
.files{list-style:none;margin:0 0 8px;padding:0;display:flex;flex-direction:column;gap:6px}
.file{border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:grid;grid-template-columns:1fr auto;gap:2px 8px;background:var(--panel);cursor:pointer}
.file.sel{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.file .nm{font-weight:500;overflow-wrap:anywhere}
.file .meta{grid-column:1;color:var(--muted);font-size:12px}
.file .err{grid-column:1/-1;color:var(--bad);font-size:12px}
.chip{display:inline-block;font:500 11px/1 var(--mono);padding:3px 6px;border-radius:5px;background:var(--head);color:var(--muted);border:1px solid var(--line);margin-left:6px;white-space:nowrap}
.chip.on{background:var(--soft);color:var(--accent);border-color:var(--accent)}
.chip.ex{background:transparent}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:0 4px;border-radius:4px}
.x:hover{color:var(--bad)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label,.lbl{font-size:12.5px;color:var(--muted)}
select,input[type=search]{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:100%}
.chk{display:flex;gap:8px;align-items:flex-start;margin:7px 0;font-size:13.5px}
.chk input{margin-top:3px;accent-color:var(--accent)}
.hint{color:var(--muted);font-size:12px;margin:4px 0 0}
.field .seg{align-self:flex-start}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg label{padding:6px 12px;cursor:pointer;font-size:13px;background:var(--panel)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg input:checked+span{color:var(--accent-ink)}
.seg label:has(input:checked){background:var(--accent);color:var(--accent-ink)}
.seg label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:-2px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:0}
.tile .k{font-size:11.5px;color:var(--muted)}
.tile .v{font:500 20px/1.25 var(--mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile .v.sm{font-size:14px;line-height:1.5}
.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);flex:1;min-width:260px}
.tab{border:0;background:none;padding:9px 14px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.actions{display:flex;gap:8px;align-items:center}
.toast{font-size:12.5px;color:var(--ok);min-width:0}
.panel{flex:1;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;overflow:hidden}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--line)}
.toolbar .q{flex:1;min-width:180px;max-width:360px}
.count{color:var(--muted);font-size:12.5px;margin-left:auto}
.pager{display:flex;gap:6px;align-items:center}
.pager select{width:auto}
.tablewrap{flex:1;min-height:0;overflow:auto}
table{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
th,td{padding:6px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;max-width:36ch;overflow:hidden;text-overflow:ellipsis}
thead th{position:sticky;top:0;background:var(--head);z-index:1;padding:0;font-weight:600}
thead th button{all:unset;box-sizing:border-box;display:flex;gap:6px;align-items:center;width:100%;padding:8px 12px;cursor:pointer;font-weight:600;white-space:nowrap}
thead th button:hover{color:var(--accent)}
thead th button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
th.num button{justify-content:flex-end}
td.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
td.idx,th.idx{color:var(--muted);font-family:var(--mono);text-align:right;width:1%}
th.idx{padding:8px 12px}
tbody tr:hover td{background:var(--soft)}
.arr{font-size:9px;color:var(--accent)}
.cols{position:relative}
.cols summary{list-style:none;cursor:pointer;border:1px solid var(--line);border-radius:7px;padding:7px 11px;background:var(--panel);font-weight:500}
.cols summary::-webkit-details-marker{display:none}
.cols .menu{position:absolute;z-index:5;top:calc(100% + 6px);left:0;width:300px;max-height:340px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 10px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.menu .chk{margin:5px 0}
.menu .btnrow{margin-bottom:6px}
.pad{padding:16px;overflow:auto;flex:1;min-height:0}
.pad h3{margin:18px 0 8px;font-size:13px}
.pad h3:first-child{margin-top:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 16px;margin-bottom:14px}
.mini{border:1px solid var(--line);border-radius:8px;overflow:auto;margin-bottom:6px}
.mini td,.mini th{max-width:none}
.mini thead th{position:static;padding:7px 12px}
.warn{color:var(--warn);margin:4px 0}
.tree,.tree ul{list-style:none;margin:0;padding-left:18px;font:13px/1.7 var(--mono)}
.tree{padding-left:0}
.tree summary{cursor:pointer}
.tree .nm{font-weight:500}
.tree .smp{color:var(--muted);margin-left:12px}
.tree .leaf{padding-left:15px}
.link{border:0;background:none;color:var(--accent);cursor:pointer;margin-left:10px;font:inherit;text-decoration:underline;padding:0}
pre.csv{margin:0;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font:12.5px/1.55 var(--mono);overflow:auto;white-space:pre;max-height:100%}
.empty{margin:auto;text-align:center;color:var(--muted);padding:40px 16px;max-width:420px}
.empty strong{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
@media (max-width:900px){
  body{overflow:auto}
  .app{display:block;height:auto}
  .side{border-right:0;border-bottom:1px solid var(--line)}
  .main{padding:14px 16px}
  .panel{min-height:420px}
  .tablewrap{max-height:70vh}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="mark" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6 3 12l5 6"/><path d="m16 6 5 6-5 6"/><path d="M13.5 5 10.5 19"/></svg>
      </div>
      <div><h1>CAMT and TWIST Parser</h1><p>Bank fee statements to CSV and JSON</p></div>
    </div>

    <div>
      <input id="file" class="vh" type="file" multiple accept=".xml,.txt,.twist,text/xml,application/xml">
      <label class="drop" id="drop" for="file">
        <strong>Drop statement files here</strong>
        <span>or click to browse</span>
        <small>camt.086 or TWIST XML, several at once. Files are read in this browser and never uploaded.</small>
      </label>
    </div>

    <div class="sec">
      <h2>Files</h2>
      <ul class="files" id="files"></ul>
      <div class="btnrow">
        <button class="btn" id="examples" type="button">Load examples</button>
        <button class="btn" id="clear" type="button">Clear all</button>
      </div>
    </div>

    <div class="sec">
      <h2>Rows</h2>
      <div class="field">
        <label for="rowSel">One CSV row per</label>
        <select id="rowSel"></select>
        <p class="hint" id="rowHint"></p>
      </div>
      <label class="chk"><input type="checkbox" id="ctx" checked><span>Repeat header and statement fields on every row</span></label>
      <label class="chk"><input type="checkbox" id="src" checked><span>Add a source file column</span></label>
      <label class="chk"><input type="checkbox" id="addr"><span>Include postal address fields</span></label>
      <label class="chk"><input type="checkbox" id="signed"><span>Add signed amounts (DBIT becomes negative)</span></label>
    </div>

    <div class="sec">
      <h2>Column names</h2>
      <div class="seg" role="radiogroup" aria-label="Column names">
        <label><input type="radio" name="naming" value="short" checked><span>Short</span></label>
        <label><input type="radio" name="naming" value="full"><span>Full path</span></label>
      </div>
      <p class="hint">Short uses the fewest path parts that keep each name unique.</p>
    </div>
  </aside>

  <main class="main">
    <div class="tiles" id="tiles"></div>
    <div class="bar">
      <div class="tabs" role="tablist" id="tabs">
        <button class="tab" role="tab" data-tab="table">Table</button>
        <button class="tab" role="tab" data-tab="summary">Summary</button>
        <button class="tab" role="tab" data-tab="structure">Structure</button>
        <button class="tab" role="tab" data-tab="csv">Export</button>
      </div>
      <div class="actions">
        <span class="toast" id="toast" role="status" aria-live="polite"></span>
        <button class="btn" id="copy" type="button">Copy CSV</button>
        <button class="btn pri" id="download" type="button">Download CSV</button>
      </div>
    </div>
    <div class="panel" id="view"></div>
  </main>
</div>

<script>
(()=>{

const NOT_AMT_RE=/(number|identifier|id|nb|code|cd|region|rgn|designation|method|mtd|reason|rsn|rate|ref)$/i;

async function readFile(file){

  let text;
  try{text=new TextDecoder(m?m[1]:'utf-8').decode(buf);}catch(e){text=new TextDecoder('utf-8').decode(buf);}

}
function detect(root){

}

      if((AMT_RE.test(el.localName)&&!NOT_AMT_RE.test(el.localName))||s.ccy) s.amtLeaf=true;

function rowText(r){let t=textCache.get(r);if(t===undefined){t=Object.values(r).join('\u0001').toLowerCase();textCache.set(r,t);}return t;}
function refresh(){
  let r=S.rows;const q=S.search.trim().toLowerCase();
  if(q) r=r.filter(x=>rowText(x).includes(q));
  if(S.sort){
    const {key,dir}=S.sort,num=S.numeric.has(key);
    r=[...r].sort((a,b)=>{
      const x=a[key]===undefined?'':a[key],y=b[key]===undefined?'':b[key];
      if(num){
        const dx=x===''?-Infinity:+x,dy=y===''?-Infinity:+y;
        return (dx<dy?-1:dx>dy?1:0)*dir;
      }
      return x.localeCompare(y,undefined,{numeric:true})*dir;
    });
  }
  S.view=r;
}

/* ---------- CSV ---------- */
function makeCsv(limit){
  const o=S.csv,vis=S.cols.filter(c=>!S.hidden.has(c));
  const q=v=>{
    v=v==null?'':String(v);
    const need=o.quote==='all'||v.includes(o.delim)||/["\r\n]/.test(v)||/^\s|\s$/.test(v);
    return need?'"'+v.replace(/"/g,'""')+'"':v;
  };
  const lines=[];
  if(o.header) lines.push(vis.map(c=>q(S.labels.get(c))).join(o.delim));
  const n=limit?Math.min(limit,S.view.length):S.view.length;
  for(let i=0;i<n;i++){
    const r=S.view[i];
    lines.push(vis.map(c=>{
      let v=r[c];if(v===undefined) v='';
      if(o.decimal!=='.'&&v!==''&&S.amount.has(c)) v=v.replace('.',o.decimal);
      return q(v);
    }).join(o.delim));
  }
  return lines.length?lines.join(o.eol)+o.eol:'';
}
function makeJson(limit){
  const vis=S.cols.filter(c=>!S.hidden.has(c));
  const n=limit?Math.min(limit,S.view.length):S.view.length;
  const out=[];
  for(let i=0;i<n;i++){
    const r=S.view[i],o={};
    for(const c of vis){
      let v=r[c];
      if(v===undefined||v==='') v=null;
      else if(S.js.num&&S.amount.has(c)) v=Number(v);
      o[S.labels.get(c)]=v;
    }
    out.push(o);
  }
  return JSON.stringify(out,null,S.js.pretty?2:0)+'\n';
}
function makeOut(limit){return S.fmt==='json'?makeJson(limit):makeCsv(limit);}
const fmtName=()=>S.fmt==='json'?'JSON':'CSV';
function csvName(){
  const ok=S.files.filter(f=>!f.error);
  if(ok.length===1) return ok[0].name.replace(/\.[^.]+$/,'')+(S.fmt==='json'?'.json':'.csv');
  return 'parsed-statements'+(S.fmt==='json'?'.json':'.csv');
}
let toastT;
function toast(msg,bad){
  const t=$('#toast');t.textContent=msg;t.style.color=bad?'var(--warn)':'var(--ok)';
  clearTimeout(toastT);toastT=setTimeout(()=>{t.textContent='';},4000);
}
async function copyCsv(){
  const csv=makeOut();
  try{await navigator.clipboard.writeText(csv);toast('Copied '+nf(S.view.length)+' rows');return;}catch(e){}
  try{
    const ta=document.createElement('textarea');ta.value=csv;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();
    if(ok){toast('Copied '+nf(S.view.length)+' rows');return;}
  }catch(e){}
  toast('Copy was blocked. Open the CSV tab and select the text.',true);
}
async function saveCsv(){
  const csv=(S.fmt==='csv'&&S.csv.bom?'\uFEFF':'')+makeOut(),name=csvName();
  let dl=S.dl;
  const inHost=typeof window.claude!=='undefined'&&window.claude&&typeof window.claude.use==='function';
  if(!dl&&inHost){try{dl=await window.claude.use('downloads');}catch(e){}}
  if(dl){
    try{await dl.save({filename:name,data:csv});toast('Saved '+name);}
    catch(e){toast(e&&e.code==='declined'?'Download cancelled':'Download is not available here. Use Copy CSV.',true);}
    return;
  }
  if(inHost){toast('Download is not available here. Use Copy CSV.',true);return;}
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:S.fmt==='json'?'application/json;charset=utf-8':'text/csv;charset=utf-8'}));
  a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);
  toast('Saved '+name);
}

/* ---------- rendering ---------- */
function fmtTotals(m){
  return [...m].map(([c,t])=>c+' '+t.sum.toLocaleString('en-GB',{minimumFractionDigits:t.d,maximumFractionDigits:t.d})).join(' \u00b7 ');
}
function renderTiles(){
  const ok=S.files.filter(f=>!f.error);
  const tags=[...new Set(ok.map(f=>f.fmt.tag))].join(', ')||'none';
  const tk=[...S.amount].find(k=>S.totals.has(k)&&!k.includes('~'));
  const tm=tk?S.totals.get(tk):null;
  $('#tiles').innerHTML=
    `<div class="tile"><div class="k">Files</div><div class="v">${ok.length}</div><div class="k">${esc(tags)}</div></div>`+
    `<div class="tile"><div class="k">Rows</div><div class="v">${nf(S.rows.length)}</div><div class="k">${S.view.length!==S.rows.length?nf(S.view.length)+' after filter':'in the CSV'}</div></div>`+
    `<div class="tile"><div class="k">Columns</div><div class="v">${S.cols.length-S.hidden.size}</div><div class="k">${S.hidden.size?S.hidden.size+' hidden':'all shown'}</div></div>`+
    `<div class="tile"><div class="k">${tk?esc(S.labels.get(tk))+' total':'Amount total'}</div><div class="v sm">${tm&&tm.size?esc(fmtTotals(tm)):'No amount columns found'}</div></div>`;
}
function renderSide(){
  const ul=$('#files');
  ul.innerHTML=S.files.map(f=>`<li class="file${f.id===S.sel?' sel':''}" data-act="selfile" data-id="${f.id}">
    <span class="nm">${esc(f.name)}</span><button class="x" data-act="rmfile" data-id="${f.id}" aria-label="Remove ${esc(f.name)}" title="Remove">&times;</button>
    <span class="meta">${f.error?'':`<span class="chip on">${esc(f.fmt.tag)}</span>`}${f.example?'<span class="chip ex">example</span>':''} ${f.error?'':nf(f.rowCount||0)+' rows'}</span>
    ${f.error?`<span class="err">${esc(f.error)}</span>`:''}</li>`).join('')||'<li class="hint">No files yet.</li>';
  const sel=$('#rowSel');
  sel.innerHTML='<option value="auto">Auto-detect</option>'+S.rowOptions.map(([n,c])=>`<option value="${esc(n)}">${esc(n)} (${nf(c)})</option>`).join('');
  sel.value=S.rowName;
  const ok=S.files.filter(f=>!f.error&&f.rowStat);
  const tags=new Set(ok.map(f=>f.fmt.tag.replace(/\.\d+\.\d+$/,'')));
  $('#rowHint').textContent=ok.length?(S.rowName==='auto'?'Auto picked: ':'Using: ')+[...new Set(ok.map(f=>f.rowStat.name))].join(', ')+'.'+(tags.size>1?' These files use different layouts, so the CSV holds the columns of both. Remove one file for a tidier export.':''):'';
  $('#copy').disabled=$('#download').disabled=!S.rows.length;
  $('#copy').textContent='Copy '+fmtName();$('#download').textContent='Download '+fmtName();
}
function renderTabs(){
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',String(t.dataset.tab===S.tab)));
}
function emptyHtml(){
  return `<div class="empty"><strong>No rows to show</strong>Drop a camt.086 or TWIST XML file on the left, or load the examples to see how the output looks.<p><button class="btn pri" data-act="examples" type="button">Load examples</button></p></div>`;
}
function renderView(){
  renderTabs();
  const v=$('#view');
  if(!S.files.length){v.innerHTML=emptyHtml();return;}
  if(S.tab==='table') viewTable(v);
  else if(S.tab==='summary') viewSummary(v);
  else if(S.tab==='structure') viewStructure(v);
  else viewCsv(v);
}
function viewTable(v){
  if(!S.rows.length){v.innerHTML='<div class="empty"><strong>No rows</strong>The files loaded but no records were found. Check the Summary tab for details.</div>';return;}
  v.innerHTML=`<div class="toolbar">
    <input class="q" id="q" type="search" placeholder="Filter rows" aria-label="Filter rows" value="${esc(S.search)}">
    <details class="cols" id="colsMenu"><summary>Columns</summary><div class="menu" id="colsList"></div></details>
    <span class="count" id="count"></span>
    <div class="pager"><button class="btn" data-act="prev" type="button" aria-label="Previous page">Prev</button>
    <button class="btn" data-act="next" type="button" aria-label="Next page">Next</button>
    <select id="size" aria-label="Rows per page">${[50,100,250,500].map(n=>`<option value="${n}"${n===S.size?' selected':''}>${n} per page</option>`).join('')}</select></div>
  </div><div class="tablewrap" id="tablearea"></div>`;
  fillCols();fillTable();
}
function fillCols(){
  const m=$('#colsList');if(!m) return;
  m.innerHTML=`<div class="btnrow"><button class="btn" data-act="showall" type="button">Show all</button><button class="btn" data-act="hideall" type="button">Hide all</button></div>`+
    S.cols.map((c,i)=>`<label class="chk"><input type="checkbox" data-act="togglecol" data-i="${i}"${S.hidden.has(c)?'':' checked'}><span>${esc(S.labels.get(c))}</span></label>`).join('');
}
function fillTable(){
  const area=$('#tablearea');if(!area) return;
  const vis=S.cols.map((c,i)=>[c,i]).filter(([c])=>!S.hidden.has(c));
  const total=S.view.length,pages=Math.max(1,Math.ceil(total/S.size));
  if(S.page>=pages) S.page=pages-1;
  const a=S.page*S.size,slice=S.view.slice(a,a+S.size);
  let h='<table><thead><tr><th class="idx">#</th>';
  for(const [c,i] of vis){
    const on=S.sort&&S.sort.key===c;
    h+=`<th class="${S.amount.has(c)?'num':''}" aria-sort="${on?(S.sort.dir>0?'ascending':'descending'):'none'}"><button data-act="sort" data-i="${i}" title="${esc(c)}">${esc(S.labels.get(c))}<span class="arr">${on?(S.sort.dir>0?'&#9650;':'&#9660;'):''}</span></button></th>`;
  }
  h+='</tr></thead><tbody>';
  slice.forEach((r,n)=>{
    h+=`<tr><td class="idx">${a+n+1}</td>`;
    for(const [c] of vis){const v=r[c]===undefined?'':r[c];h+=`<td class="${S.amount.has(c)?'num':''}" title="${esc(v)}">${esc(v)}</td>`;}
    h+='</tr>';
  });
  area.innerHTML=h+'</tbody></table>'+(total?'':'<div class="empty">No rows match the filter.</div>');
  const cnt=$('#count');
  if(cnt) cnt.textContent=total?`Rows ${nf(a+1)} to ${nf(a+slice.length)} of ${nf(total)}`+(total!==S.rows.length?` (filtered from ${nf(S.rows.length)})`:''):'0 rows';
  renderTiles();
}
function viewSummary(v){
  let h='<div class="pad">';
  h+='<h3>Totals by amount column and currency</h3><p class="hint">Where a sign flag (Sgn or CdtDbtInd) sits next to an amount, it is applied.</p>';
  if(S.totals.size){
    h+='<div class="mini"><table><thead><tr><th>Column</th><th>Currency</th><th class="num" style="text-align:right">Rows</th><th class="num" style="text-align:right">Total</th></tr></thead><tbody>';
    for(const [k,m] of S.totals) for(const [c,t] of m){
      h+=`<tr><td>${esc(S.labels.get(k))}</td><td>${esc(c)}</td><td class="num">${nf(t.n)}</td><td class="num">${t.sum.toLocaleString('en-GB',{minimumFractionDigits:t.d,maximumFractionDigits:t.d})}</td></tr>`;
    }
    h+='</tbody></table></div>';
  }else h+='<p class="hint">No numeric amount columns were found.</p>';
  h+='<h3>Files</h3><div class="mini"><table><thead><tr><th>File</th><th>Format</th><th>Row element</th><th style="text-align:right">Rows</th></tr></thead><tbody>';
  for(const f of S.files){
    h+=`<tr><td>${esc(f.name)}</td><td>${f.error?'<span class="chip">error</span>':esc(f.fmt.label)+' <span class="chip">'+esc(f.fmt.tag)+'</span>'}</td><td>${f.rowStat?esc(f.rowStat.path.split('/').slice(-3).join(' / ')):''}</td><td class="num">${f.error?'':nf(f.rowCount||0)}</td></tr>`;
  }
  h+='</tbody></table></div>';
  if(S.warn.length) h+='<h3>Warnings</h3>'+S.warn.map(w=>`<p class="warn">${esc(w)}</p>`).join('');
  v.innerHTML=h+'</div>';
}
function treeHtml(f){
  const st=f.stats;
  const node=p=>{
    const s=st.get(p);
    const chips=(s.count>1?`<span class="chip">&times;${nf(s.count)}</span>`:'')+(f.rowStat&&f.rowStat.path===p?'<span class="chip on">rows</span>':'');
    if(s.isLeaf) return `<li class="leaf"><span class="nm">${esc(s.name)}</span>${chips}<span class="smp">${esc(s.sample)}</span></li>`;
    const use=(s.depth>0&&s.count>1)?`<button class="link" data-act="userows" data-name="${esc(s.name)}" type="button">use as rows</button>`:'';
    return `<li><details${s.depth<4?' open':''}><summary><span class="nm">${esc(s.name)}</span>${chips}${use}</summary><ul>${[...s.children].map(node).join('')}</ul></details></li>`;
  };
  return `<ul class="tree">${node(f.root.localName)}</ul>`;
}
function viewStructure(v){
  const f=S.files.find(x=>x.id===S.sel&&!x.error)||S.files.find(x=>!x.error);
  if(!f){v.innerHTML='<div class="empty"><strong>No readable file</strong>Select a file that parsed without errors.</div>';return;}
  v.innerHTML=`<div class="pad"><h3>${esc(f.name)} <span class="chip on">${esc(f.fmt.tag)}</span></h3><p class="hint">Elements that repeat show a count. Pick the one that should become one CSV row.</p>${treeHtml(f)}</div>`;
}
function viewCsv(v){
  const o=S.csv,j=S.js;
  const sel=(id,label,opts,val)=>`<div class="field"><label for="${id}">${label}</label><select id="${id}">${opts.map(([a,b])=>`<option value="${esc(a)}"${a===val?' selected':''}>${esc(b)}</option>`).join('')}</select></div>`;
  const csvOpts=`<div class="grid2">
      ${sel('oDelim','Delimiter',[[',','Comma'],[';','Semicolon'],['\t','Tab'],['|','Pipe']],o.delim)}
      ${sel('oQuote','Quoting',[['min','Only when needed'],['all','Every field']],o.quote)}
      ${sel('oEol','Line endings',[['\r\n','Windows (CRLF)'],['\n','Unix (LF)']],o.eol)}
      ${sel('oDec','Decimal mark in amounts',[['.','Point (1234.50)'],[',','Comma (1234,50)']],o.decimal)}
    </div>
    <label class="chk"><input type="checkbox" id="oHead"${o.header?' checked':''}><span>Include header row</span></label>
    <label class="chk"><input type="checkbox" id="oBom"${o.bom?' checked':''}><span>Add a UTF-8 byte order mark (helps Excel show non-English characters; some import tools reject it)</span></label>`;
  const jsonOpts=`<label class="chk"><input type="checkbox" id="jNum"${j.num?' checked':''}><span>Write amounts as numbers (otherwise as text, keeping trailing zeros)</span></label>
    <label class="chk"><input type="checkbox" id="jPretty"${j.pretty?' checked':''}><span>Indent for readability</span></label>
    <p class="hint">Empty fields are written as null. Each row becomes one object in a JSON array.</p>`;
  v.innerHTML=`<div class="pad">
    <div class="field"><span class="lbl">Format</span>
      <div class="seg" role="radiogroup" aria-label="Output format">
        <label><input type="radio" name="outfmt" value="csv"${S.fmt==='csv'?' checked':''}><span>CSV</span></label>
        <label><input type="radio" name="outfmt" value="json"${S.fmt==='json'?' checked':''}><span>JSON</span></label>
      </div></div>
    ${S.fmt==='csv'?csvOpts:jsonOpts}
    <h3>Preview</h3>
    <p class="hint" id="csvNote"></p>
    <pre class="csv" id="csvPre" tabindex="0" aria-label="Output preview"></pre>
  </div>`;
  fillCsv();
}
function fillCsv(){
  const pre=$('#csvPre');if(!pre) return;
  const lim=S.fmt==='json'?5:40;
  const txt=makeOut(lim);
  pre.textContent=txt||'Nothing to export yet.';
  const vis=S.cols.length-S.hidden.size;
  $('#csvNote').textContent=`Exports ${nf(S.view.length)} of ${nf(S.rows.length)} rows and ${vis} of ${S.cols.length} columns, using the current filter, sort and column choices. Showing the first ${lim}${S.fmt==='json'?' records':' lines'}.`;
}
function renderAll(){renderSide();renderTiles();renderView();}

/* ---------- events ---------- */
async function addFiles(list){
  for(const file of list){
    try{ingest(file.name,file.size,await readFile(file));}
    catch(e){const f={id:++uid,name:file.name,size:file.size,error:'Could not read this file.'};S.files.push(f);}
  }
  build();renderAll();
}
function loadExamples(){
  for(const e of EXAMPLES) ingest(e.name,e.text.length,e.text,true);
  build();renderAll();
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act],.tab');if(!t) return;
  if(t.classList.contains('tab')){S.tab=t.dataset.tab;renderView();return;}
  const act=t.dataset.act;
  if(act==='selfile'){if(e.target.closest('[data-act="rmfile"]')) return;S.sel=+t.dataset.id;renderSide();if(S.tab==='structure')renderView();}
  else if(act==='rmfile'){S.files=S.files.filter(f=>f.id!==+t.dataset.id);if(!S.files.find(f=>f.id===S.sel))S.sel=S.files.length?S.files[0].id:null;build();renderAll();}
  else if(act==='examples') loadExamples();
  else if(act==='sort'){
    const k=S.cols[+t.dataset.i];
    if(!S.sort||S.sort.key!==k) S.sort={key:k,dir:1};
    else if(S.sort.dir===1) S.sort={key:k,dir:-1};
    else S.sort=null;
    refresh();fillTable();
  }
  else if(act==='prev'){if(S.page>0){S.page--;fillTable();}}
  else if(act==='next'){if((S.page+1)*S.size<S.view.length){S.page++;fillTable();}}
  else if(act==='showall'){S.hidden.clear();fillCols();fillTable();}
  else if(act==='hideall'){S.hidden=new Set(S.cols);fillCols();fillTable();}
  else if(act==='userows'){e.preventDefault();S.rowName=t.dataset.name;build();renderAll();}
});
document.addEventListener('change',e=>{
  const t=e.target,id=t.id;
  if(t.dataset.act==='togglecol'){const k=S.cols[+t.dataset.i];t.checked?S.hidden.delete(k):S.hidden.add(k);fillTable();return;}
  if(id==='file'){addFiles(t.files);t.value='';return;}
  if(id==='rowSel'){S.rowName=t.value;build();renderAll();}
  else if(id==='ctx'){S.ctx=t.checked;build();renderAll();}
  else if(id==='src'){S.src=t.checked;build();renderAll();}
  else if(id==='addr'){S.addr=t.checked;build();renderAll();}
  else if(id==='signed'){S.signed=t.checked;build();renderAll();}
  else if(t.name==='naming'){S.naming=t.value;S.labels=makeLabels(S.cols);renderAll();}
  else if(id==='size'){S.size=+t.value;S.page=0;fillTable();}
  else if(id==='oDelim'){S.csv.delim=t.value;fillCsv();}
  else if(id==='oQuote'){S.csv.quote=t.value;fillCsv();}
  else if(id==='oEol'){S.csv.eol=t.value;fillCsv();}
  else if(id==='oDec'){S.csv.decimal=t.value;fillCsv();}
  else if(id==='oHead'){S.csv.header=t.checked;fillCsv();}
  else if(id==='oBom'){S.csv.bom=t.checked;}
  else if(t.name==='outfmt'){S.fmt=t.value;renderSide();renderView();}
  else if(id==='jNum'){S.js.num=t.checked;fillCsv();}
  else if(id==='jPretty'){S.js.pretty=t.checked;fillCsv();}
});
let qT;
document.addEventListener('input',e=>{
  if(e.target.id!=='q') return;
  clearTimeout(qT);const val=e.target.value;
  qT=setTimeout(()=>{S.search=val;S.page=0;refresh();fillTable();},150);
});
$('#examples').addEventListener('click',loadExamples);
$('#clear').addEventListener('click',()=>{S.files=[];S.sel=null;S.search='';S.sort=null;S.rowName='auto';build();renderAll();});
$('#copy').addEventListener('click',copyCsv);
$('#download').addEventListener('click',saveCsv);
const drop=$('#drop');
['dragenter','dragover'].forEach(n=>window.addEventListener(n,e=>{e.preventDefault();drop.classList.add('over');}));
['dragleave','drop'].forEach(n=>window.addEventListener(n,e=>{e.preventDefault();if(n==='drop'||e.target===document.documentElement)drop.classList.remove('over');}));
window.addEventListener('drop',e=>{if(e.dataTransfer&&e.dataTransfer.files.length) addFiles(e.dataTransfer.files);});

if(typeof window.claude!=='undefined'&&window.claude&&window.claude.use){
  window.claude.use('downloads').then(d=>{S.dl=d;}).catch(()=>{});
}
loadExamples();
})();
</script>
